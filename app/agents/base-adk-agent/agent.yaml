name: base-adk-agent
description: A base agent built with ADK using standalone OTEL observability.
version: 1.0.0

entrypoint:
  module: agent_app
  object: adk_app

resources:
  cpu: 1
  memory: 4Gi
  min_instances: 0
  max_instances: 1
  concurrency: 9

env:
  # --- Resource Identity & Dashboard Triggers ---
  # Essential for grouping traces into the 'Vertex AI' specialized UI
  OTEL_RESOURCE_ATTRIBUTES: "gen_ai.system=vertex_ai,gcp.resource_type=reasoning_engine"
  OTEL_SERVICE_NAME: "base-adk-agent"
  
  # --- If Agent Engine Trace Provider ---
  # Master switch for OpenTelemetry on Vertex AI Agent Engine
  GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: true
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true
  ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: false

  GCS_BUCKET: ${GCS_OFFLOAD_BUCKET_NAME}
  A2A_AGENT_URL: ${A2A_AGENT_URL}
  EVENTS_DATASET_ID: "root_agent_logs_dev"
  EVENTS_TABLE_ID: "agent_events"
  MODEL_NAME: "gemini-2.5-flash"

labels:
  author: "your-name"
  version: "latest"

framework: google-adk
