name: a2a-mortgage-agent
description: A2A mortgage agent with MCP tool connections for document management, income verification, and corporate email.
version: 1.0.0

entrypoint:
  module: agent_app
  object: adk_app

resources:
  cpu: 1
  memory: 4Gi
  min_instances: 0
  max_instances: 1
  concurrency: 9

env:
  AGENT_NAME: "a2a_mortgage_agent"
  # --- Resource Identity & Dashboard Triggers ---
  OTEL_RESOURCE_ATTRIBUTES: "gen_ai.system=vertex_ai,gcp.resource_type=reasoning_engine"
  OTEL_SERVICE_NAME: "a2a-mortgage-agent"

  # --- Agent Engine Trace Provider ---
  USE_CUSTOM_TELEMETRY: false
  GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: true
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true

  PROJECT_NAME: "a2a-mortgage-agent"
  GCS_BUCKET: ${GCS_OFFLOAD_BUCKET_NAME}
  DMS_MCP_URL: "http://esmeralda.internal/legacy-dms/mcp"
  INCOME_VERIFICATION_URL: "http://esmeralda.internal/income-verification/mcp"
  EMAIL_MCP_URL: "http://esmeralda.internal/corporate-email/mcp"
  MODEL_NAME: "gemini-2.5-flash"
  EVENTS_DATASET_ID: "agent_logs"
  EVENTS_TABLE_ID: "agent_events"
  CLOUD_SQL_INSTANCE: ${PROJECT_ID}:${REGION}:a2a-agent-pg
  DB_IAM_USER: test-vm-sa@${PROJECT_ID}.iam
  DB_NAME: "a2a_tasks"

labels:
  author: "your-name"
  version: "latest"

framework: a2a
