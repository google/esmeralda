# catalog/environments/dev.yaml: dev overrides only, applied after every source.
# Deep merge: maps merge, lists replace, null deletes.

schema: esmeralda.catalog
schema_version: 1

environment: dev

# dev showcases the Apigee partner front door (env.yaml governance.capabilities.partner_access =
# "apigee"): the partner-mcp proxy reaches the MCP servers it exposes as the caller
# apigee-partner-mcp (roles/run.invoker on those services).
#
# Verified attribution rollout: dev ran with unmapped_caller: flag first (the in-process caller guard
# logged unknown callers instead of rejecting them) until `esmeralda verify --env dev` and the guard
# logs showed no unmapped or unverified caller; it now follows policy.yaml (deny). To onboard callers
# again, set `policy: { attribution: { unmapped_caller: flag } }` under overrides. flag never widens
# a gateway or IAM grant, and only the environments in policy.attribution.flag_environments
# (default: dev) accept it.
overrides:
  targets:
    corporate-email:
      callers: { apigee-partner-mcp: {} }
    income-verification:
      callers: { apigee-partner-mcp: {} }
    # Synthetic external (managed: false) target that proves per-target Agent Gateway egress for
    # targets Esmeralda doesn't deploy: it gets its own Agent Registry entry and a roles/iap.egressor
    # list with the specialist only. Nothing serves the host, so an allowed call reaches the entry
    # point and gets its no-route 404, while the Agent Gateway answers a denied call (any other agent)
    # with 403. `esmeralda verify` checks the entry URL and its IAP policy.
    external-probe:
      kind: http
      description: Synthetic external HTTP target (no backend) proving per-target egress for managed false targets.
      owner_team: platform
      deploy: { managed: false, endpoint: "https://external-probe.{domain}" }
      gateway: agent_gateway
      callers:
        ai-coe-mortgage-specialist: {}
      observability:
        usage_sources: [gateway]
# Examples:
# overrides:
#   targets:
#     cx-mortgage-orchestrator:
#       serving: { timeout: 900 }
