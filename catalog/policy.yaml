# catalog/policy.yaml: attribution rules, defaults and registered usage dimensions.
# Owned by platform + security.
schema: esmeralda.catalog
schema_version: 1

policy:
  attribution:
    # An authenticated caller that is not in the catalog: deny (fail closed) | flag (allow + alert).
    # Gateway and IAM grants always come from the catalog, so an unknown caller is refused there in
    # both modes; flag only relaxes the in-process caller guard (esmeralda.attribution).
    unmapped_caller: deny
    # Declared cost centre / country the catalog does not allow for the caller: reject | bill_own_team.
    declared_mismatch: reject
    # Environments that may set unmapped_caller: flag (environments/<env>.yaml overrides).
    flag_environments: [dev]

  # `esmeralda verify` catalog-drift step (catalog diff findings, and live drift of the enabled
  # snapshot sources): warn (reported, verify still passes) | fail (any finding fails verify).
  # An unreachable source is never a failure. `verify --catalog-strict` forces fail for one run.
  verify:
    catalog_drift: warn

  # Applied to every target that leaves the field unset (resolved view only; the Terraform
  # catalog map only carries what targets set explicitly).
  defaults:
    gateway: direct
    user_credential:
      accept: false
    observability:
      usage_sources: [workload]
      content_capture: none
      sampling: 1.0

  # Usage-event `dimensions` keys: a key is accepted only if it is registered here.
  dimensions:
    loan_product:
      description: Mortgage product the request is about.
      values: [fixed-30, fixed-15, arm-5-1]

  # Agent Gateway per-target roles/iap.egressor lists (compiled into catalog/.resolved/<env>.json
  # `iap_egress`). Each caller of an mcp/a2a target is listed by its identity: an agent caller by its
  # Agent Identity principal (unit output agent_identity_principal), which is also the identity it
  # calls out as (no shared workload identity: agents mint their own tokens).
  agent_gateway:
    # Google APIs agents reach through the Agent Gateway (compiled into `google_apis`; layer 4
    # registers only these). An agent reaches the baseline plus the APIs in its own google_apis,
    # nothing else. Names come from the resolver's known-hosts table (esmeralda.catalog.GOOGLE_APIS).
    google_apis:
      # Every agent runtime, granted to the agent projects (not per engine) so a replaced engine can
      # start before the iap-egress unit grants its new identity.
      baseline:
        - telemetry                  # OpenTelemetry export (traces, logs, metrics) from esmeralda serve --otel-to-cloud
        - aiplatform_runtime_region  # <region>-aiplatform: Agent Runtime sessions and the Vertex AI SDK
        - cloudresourcemanager       # project lookup at startup (telemetry resource detection, gRPC)
        - iamcredentials             # google-auth credential lookups for the runtime identity
