# catalog/sources.yaml: which sources `esmeralda catalog resolve` merges, in order.
# Owned by platform + security (see README.md, CODEOWNERS).
#
# `files` comes first and is the only source that may set authorization data (callers and grants,
# identities, policy, teams and cost centres, google_apis, ...). Other sources report inventory and
# attribution metadata within the capability allowlist of their type; a catalog file adopts an
# external entry only through a deploy.registry pin. Duplicates inside the `files` source always
# fail. environments/<env>.yaml overrides are applied last.
schema: esmeralda.catalog
schema_version: 1

sources:
  - name: catalog-files
    type: files
    paths:
      - teams.yaml
      - policy.yaml
      - teams
      - external

  # Inventory from Agent Registry (agents, MCP servers, endpoints). Extension point, not implemented yet.
  - name: agent-registry
    type: agent_registry
    enabled: false

  # Team attribution from the labels of the environment's projects (attribution only: never callers,
  # teams or cost centres). `esmeralda catalog fetch --env <env> --source project-labels` writes
  # snapshots/project-labels/<env>.json; resolve reads only that snapshot. Keep it after the
  # inventory sources: it fills owner_team of the entries they report.
  - name: project-labels
    type: project_labels
    enabled: false
    options:
      team_label: team
      cost_center_label: cost-center
      # team_map: { appdev-tools: platform }   # label value -> catalog team (default: same name)
      # cost_center_map: {}                    # label value -> catalog cost centre (default: same)

environments_dir: environments
resolved_dir: .resolved
