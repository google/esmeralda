# catalog/teams/ai-coe/mcp/corporate-email.yaml
schema: esmeralda.catalog
schema_version: 1

name: corporate-email
kind: mcp
description: MCP server on Cloud Run that drafts and sends applicant emails (synthetic data).
owner_team: ai-coe
deploy: { unit: services/corporate-email }
serving: { token: id, probe: mcp }

# Who may call it: this list drives both Cloud Run run.invoker and the Agent Gateway per-target
# roles/iap.egressor list. cx-mortgage-orchestrator is deliberately absent: it delegates tool work
# to the specialist over A2A and never calls MCP servers itself.
callers:
  ai-coe-mortgage-specialist: {}
  test-vm: {}

observability:
  usage_sources: [workload]
  framework: custom
