# Fails a PR when a pyproject.toml changed but uv.lock was not regenerated
# (fix: run `make lock`, commit uv.lock and push).
name: uv.lock check

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "apps/**/pyproject.toml"
      - "uv.lock"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.30" # keep in sync with the uv image in apps/services/*/Dockerfile
          enable-cache: false

      - name: uv lock --check
        run: uv lock --check
