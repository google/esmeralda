# Builds the documentation site (docs/mkdocs.yml, MkDocs Material) and publishes it to GitHub Pages.
#   - pull requests: strict build only (broken links, anchors or nav entries fail the PR);
#   - push to main / manual run: strict build + deploy to https://google.github.io/esmeralda/
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Makefile" # the Make Targets page is generated from it
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.30" # keep in sync with the uv image in apps/services/*/Dockerfile
          enable-cache: false

      - name: Build site (strict)
        run: uv run --frozen --only-group docs mkdocs build --strict -f docs/mkdocs.yml

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
