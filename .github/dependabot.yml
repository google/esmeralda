version: 2
updates:
  # Whole uv workspace (packages/esmeralda, both agents in apps/agents/*, and the 3 MCP services in
  # apps/services/*) from the committed root uv.lock. Covers direct and transitive dependencies, so
  # security updates can be proposed for both.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google:
        patterns:
          - "google-*"
    ignore:
      # a2a-sdk 1.x changes the A2A protocol/types used by both agents: upgrade in a dedicated spike.
      - dependency-name: "a2a-sdk"
        update-types: ["version-update:semver-major"]

  # SHA-pinned actions in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The gateway's Envoy image (apps/services/envoy/Dockerfile, pinned by digest). The Gateway workflow
  # runs the harness on every bump; the sandbox reads the same pin.
  - package-ecosystem: "docker"
    directory: "/apps/services/envoy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
