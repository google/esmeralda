# ==============================================================================
# Cloud Build Pipeline: Microservices (Parallel Builds)
# Triggers on changes to apps/services/**
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Parallel Step 1: Build & Push Income Verification Service Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-income-verification'
    waitFor: ['-']
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/income-verification-api:latest'
      - 'apps/services/income-verification'

  # ----------------------------------------------------------------------------
  # Parallel Step 2: Build & Push Corporate Email Service Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-corporate-email'
    waitFor: ['-']
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/corporate-email:latest'
      - 'apps/services/corporate-email'

  # ----------------------------------------------------------------------------
  # Parallel Step 3: Build & Push Legacy DMS Service Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-legacy-dms'
    waitFor: ['-']
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/legacy-dms:latest'
      - 'apps/services/legacy-dms'

  # ----------------------------------------------------------------------------
  # Step 4: Push Containers to Artifact Registry in Parallel
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-all-containers'
    waitFor: ['build-income-verification', 'build-corporate-email', 'build-legacy-dms']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/income-verification-api:latest &
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/corporate-email:latest &
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/legacy-dms:latest &
        wait

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/income-verification-api:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/corporate-email:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/esmeralda-containers/legacy-dms:latest'

options:
  logging: CLOUD_LOGGING_ONLY
