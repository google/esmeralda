# ==============================================================================
# Cloud Build Pipeline: Layer 5 Governance & Observability Infrastructure
# Triggers on changes to infrastructure/modules/4-governance/** or infrastructure/live/dev/layer-4-governance/**
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Run Governance & Telemetry Pipeline Chaos Tests
  # ----------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'test-governance-chaos'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python3 apps/agents/cx-mortgage-orchestrator/scripts/chaos_telemetry_test.py

  # ----------------------------------------------------------------------------
  # Step 2: Validate Layer 5 Governance HCL
  # ----------------------------------------------------------------------------
  - name: 'alpine/terragrunt:latest'
    id: 'validate-layer-4-governance'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infrastructure/live/dev/layer-4-governance
        terragrunt validate

  # ----------------------------------------------------------------------------
  # Step 3: Deploy Layer 5 Governance Stack (Terragrunt Apply)
  # ----------------------------------------------------------------------------
  - name: 'alpine/terragrunt:latest'
    id: 'deploy-layer-4-governance'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infrastructure/live/dev/layer-4-governance
        terragrunt apply -auto-approve

options:
  logging: CLOUD_LOGGING_ONLY
