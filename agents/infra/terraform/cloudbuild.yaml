steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Change to agents directory if we are at the repo root
        if [ -d "agents" ]; then
            cd agents
        fi
        
        # Ensure uv is installed
        if ! command -v uv &> /dev/null; then
            echo "[*] Installing uv package manager..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
        fi
        
        # Export environment variables for the deployment script
        export DEPLOY_MODE=terraform
        export PROJECT_ID=${_PROJECT_ID}
        export REGION=${_REGION}
        export AGENT_FILTER=${_AGENT_FILTER}
        export PSC_NETWORK_ATTACHMENT=${_PSC_NETWORK_ATTACHMENT}
        export VPC_NAME=${_VPC_NAME}
        export CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE}
        export GCS_OFFLOAD_BUCKET_NAME=${_GCS_OFFLOAD_BUCKET_NAME}
        
        echo "[*] Starting Cloud Build deployment with DEPLOY_MODE=terraform..."
        bash deploy.sh

substitutions:
  _PROJECT_ID: ''
  _REGION: 'us-central1'
  _AGENT_FILTER: ''
  _PSC_NETWORK_ATTACHMENT: ''
  _VPC_NAME: 'gateway-vpc'
  _CLOUD_SQL_INSTANCE: ''
  _GCS_OFFLOAD_BUCKET_NAME: ''

options:
  logging: CLOUD_LOGGING_ONLY
