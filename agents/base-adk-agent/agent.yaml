name: base-adk-agent
description: A base agent built with ADK using standalone OTEL observability.
version: 1.0.0

entrypoint:
  module: agent_app
  object: adk_app

resources:
  cpu: 1
  memory: 4Gi
  min_instances: 0
  max_instances: 1
  concurrency: 9

env:
  # --- Resource Identity & Dashboard Triggers ---
  # Essential for grouping traces into the 'Vertex AI' specialized UI
  OTEL_RESOURCE_ATTRIBUTES: "gen_ai.system=vertex_ai,gcp.resource_type=reasoning_engine"
  OTEL_SERVICE_NAME: "base-adk-agent"
  
  # --- If Agent Engine Trace Provider ---
  # Master switch for OpenTelemetry on Vertex AI Agent Engine
  USE_CUSTOM_TELEMETRY: false
  GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: true
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true

  # --- If ADK Trace Provider (Custom) ---
  # USE_CUSTOM_TELEMETRY: true
  # OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: true
  # OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true
  # ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: false

  # --- IF Multimodal Prompts and Responses offloaded to GCS ---
  # Activates the modern (v1.37+) experimental semantic conventions
  # OTEL_SEMCONV_STABILITY_OPT_IN: "gen_ai_latest_experimental"
  # OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "SPAN_AND_EVENT"
  # OTEL_INSTRUMENTATION_GENAI_COMPLETION_HOOK: "upload"
  # OTEL_INSTRUMENTATION_GENAI_UPLOAD_FORMAT: "jsonl"
  # OTEL_INSTRUMENTATION_GENAI_UPLOAD_BASE_PATH: "gs://agent-ops-foundation-agent-logs-offload-ebdd/completions"
  # GENAI_TELEMETRY_PATH: "completions"

  PROJECT_NAME: "base-adk-agent"
  GCS_BUCKET: agent-ops-foundation-agent-logs-offload-e34b
  DMS_MCP_URL: "http://dms.internal.gateway/mcp"
  INCOME_VERIFICATION_URL: "http://income-verification.internal.gateway/mcp"
  EMAIL_MCP_URL: "http://email.internal.gateway/mcp"
  EVENTS_DATASET_ID: "agent_logs"
  EVENTS_TABLE_ID: "agent_events"
  MODEL_NAME: "gemini-2.5-flash"

  # Proxy configuration for PSC-I egress
  HTTP_PROXY: "http://swp.internal.gateway:443"
  HTTPS_PROXY: "http://swp.internal.gateway:443"

labels:
  author: "your-name"
  version: "latest"

framework: google-adk

psc_interface_config:
  network_attachment: "gateway-psc-interface-attachment"
  dns_peering_configs:
    - domain: "internal.gateway."
      # Replace with your actual GCP project ID where the VPC is hosted
      target_project: "agent-ops-foundation-e34b"
      target_network: "gateway-vpc"
