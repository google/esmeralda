[project]
name = "esmeralda-ui"
version = "0.1.0"
description = "Read-only backend-for-frontend (FastAPI) of the Esmeralda console, over the esmeralda package"
requires-python = ">=3.12"
# Web dependencies stay here, never in the esmeralda runtime wheel that ships inside agent images.
dependencies = [
    "esmeralda",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-auth>=2.61",
    "google-cloud-bigquery>=3.25",
    # ES256 signature verification of the IAP JWT (google.auth.jwt) and fetching IAP's public keys.
    "cryptography>=43",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx",
    "ruff>=0.8.0",
]

[tool.uv.sources]
esmeralda = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esmeralda_ui"]
