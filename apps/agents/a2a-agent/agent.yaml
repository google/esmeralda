name: a2a-mortgage-agent
description: A2A mortgage agent with MCP tool connections for document management, income verification, and corporate email.
version: 1.0.0

entrypoint:
  module: agent_app
  object: adk_app

resources:
  cpu: 1
  memory: 4Gi
  min_instances: 0
  max_instances: 1
  concurrency: 9

env:
  AGENT_NAME: "a2a_mortgage_agent"
  # --- Resource Identity & Dashboard Triggers ---
  OTEL_RESOURCE_ATTRIBUTES: "gen_ai.system=vertex_ai,gcp.resource_type=reasoning_engine"
  OTEL_SERVICE_NAME: "a2a-mortgage-agent"

  # --- Agent Engine Trace Provider ---
  USE_CUSTOM_TELEMETRY: false
  GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: true
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true

  DMS_MCP_URL: "http://legacy-dms.esmeralda.internal/mcp"
  INCOME_VERIFICATION_URL: "http://income-verification.esmeralda.internal/mcp"
  EMAIL_MCP_URL: "http://corporate-email.esmeralda.internal/mcp"
  MODEL_NAME: "gemini-2.5-flash"

labels:
  author: "your-name"
  version: "latest"

framework: a2a

agent_card:
  name: "a2a-mortgage-agent"
  description: "Mortgage underwriting assistant with document management, income verification, and corporate email capabilities."
  version: "1.0.0"
  default_input_modes:
    - "text/plain"
  default_output_modes:
    - "application/json"
  capabilities:
    streaming: false
  preferred_transport: "HTTP+JSON"
  supports_authenticated_extended_card: true
  skills:
    - id: "document-search"
      name: "Document Search"
      description: "Search and retrieve mortgage application documents from the legacy document management system."
      tags:
        - "dms"
        - "documents"
    - id: "income-verification"
      name: "Income Verification"
      description: "Verify applicant income against employer records and tax filings."
      tags:
        - "income"
        - "verification"
    - id: "corporate-email"
      name: "Corporate Email"
      description: "Read corporate email inbox for mortgage-related communications."
      tags:
        - "email"

