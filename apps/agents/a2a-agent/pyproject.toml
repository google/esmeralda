[project]
name = "a2a-mortgage-agent"
version = "0.1.0"
description = "A2A mortgage assistant agent with MCP tool connections"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform[adk,agent_engines]>=1.74.0",
    "google-adk[a2a,mcp,otel-gcp]>=2.4.0",
    "google-auth",
    "google-cloud-logging",
    "pyyaml",
    "opentelemetry-api>=1.36.0,<1.43.0",
    "opentelemetry-sdk>=1.36.0,<1.45.0",
    "httpx",
    "cloud-sql-python-connector[asyncpg]",
    "asyncpg",
    "a2a-sdk",
    "mcp>=1.0.0",
    "google-cloud-bigquery-storage",
    "google-genai",
    "sqlalchemy",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
