name: cx-mortgage-orchestrator
description: CX mortgage orchestrator. Delegates document, income and email work to the AI CoE mortgage specialist over A2A.
version: 1.0.0

entrypoint:
  module: agent
  object: app

resources:
  cpu: 1
  memory: 4Gi
  min_instances: 0
  max_instances: 1
  concurrency: 9

env:
  AGENT_NAME: "cx_mortgage_orchestrator"
  # --- Resource Identity & Dashboard Triggers ---
  # Essential for grouping traces into the 'Vertex AI' specialized UI
  OTEL_RESOURCE_ATTRIBUTES: "gen_ai.system=vertex_ai,gcp.resource_type=reasoning_engine"
  OTEL_SERVICE_NAME: "cx-mortgage-orchestrator"
  
  # --- Agent Engine Trace Provider ---
  GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: true
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: true
  MODEL_NAME: "gemini-3.7-flash"
  MODEL_LOCATION: "global"
  GOOGLE_CLOUD_LOCATION: "us-central1"
  A2A_AGENT_URL: "https://ai-coe-mortgage-specialist.esmeralda.internal"

  # --- Central Agent Gateway & SPIFFE Identity ---
  GOOGLE_API_PREVENT_AGENT_TOKEN_SHARING_FOR_GCP_SERVICES: "False"
  GRPC_IPV6_PREFER: "0"
  GOOGLE_API_USE_CLIENT_CERTIFICATE: "false"
  GOOGLE_API_USE_MTLS_ENDPOINT: "never"
  GOOGLE_GENAI_USE_VERTEXAI: "True"
  NO_PROXY: "169.254.169.254,metadata.google.internal"

# Local runs only (esmeralda query / esmeralda serve on a workstation): LOCAL_MODE loads the
# specialist in-process instead of calling it over A2A, and `make query` / `make serve` start the
# three MCP servers on these ports. Applied on top of `env`, and never overrides a variable
# already set in the shell.
local_env:
  LOCAL_MODE: "true"
  EMAIL_MCP_URL: "http://localhost:8001/mcp"
  INCOME_VERIFICATION_URL: "http://localhost:8002/mcp"
  DMS_MCP_URL: "http://localhost:8003/mcp"

framework: google-adk
