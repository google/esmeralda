# apps/services/corporate-email/cloudbuild.yaml
# Cloud Build pipeline for Corporate Email Microservice container build & Agent Registry registration across spoke projects

steps:
  # Step 1: Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/corporate-email:latest', '.']

  # Step 2: Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/corporate-email:latest']

  # Step 3: Register/Sync Microservice Endpoint across all agent-spoke projects
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SPOKE_PROJECTS=$$(gcloud projects list --filter="labels.agent_platform=agent-spoke-project" --format="value(projectId)")
        echo "Found agent spoke projects for registration: $$SPOKE_PROJECTS"
        for PROJ in $$SPOKE_PROJECTS; do
          echo "Registering corporate-email in project $$PROJ..."
          gcloud alpha agent-registry services create corporate-email \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="corporate-email" \
            --description="FastMCP service providing internal email verification tools" \
            --interfaces="url=http://corporate-email.esmeralda.internal:8001/mcp,protocolBinding=json-rpc" \
            --mcp-server-spec-type=no-spec || \
          gcloud alpha agent-registry services update corporate-email \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="corporate-email" \
            --description="FastMCP service providing internal email verification tools" \
            --interfaces="url=http://corporate-email.esmeralda.internal:8001/mcp,protocolBinding=json-rpc"
        done

substitutions:
  _REGION: 'us-central1'
  _CICD_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
