# apps/services/corporate-email/cloudbuild.yaml
# Cloud Build pipeline for Corporate Email Microservice container build & Agent Registry registration across spoke projects

steps:
  # Step 1: Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/corporate-email:${_TAG}', '.']

  # Step 2: Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/corporate-email:${_TAG}']

  # Step 3: Discover agent spoke projects matching _ENV and register/sync endpoint with tool-spec
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SPOKE_PROJECTS=$$(gcloud projects list --filter="labels.agent_platform=agent-spoke-project AND labels.env=${_ENV}" --format="value(projectId)")
        echo "Cloud Build discovered spoke projects for environment ${_ENV}: $$SPOKE_PROJECTS"
        for PROJ in $$SPOKE_PROJECTS; do
          echo "Syncing corporate-email in project $$PROJ..."
          gcloud alpha agent-registry services create corporate-email \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="corporate-email" \
            --description="FastMCP service providing internal email verification tools" \
            --interfaces="url=http://corporate-email.esmeralda.internal/mcp,protocolBinding=jsonrpc" \
            --mcp-server-spec-type=tool-spec \
            --mcp-server-spec-content=tools.json || \
          gcloud alpha agent-registry services update corporate-email \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="corporate-email" \
            --description="FastMCP service providing internal email verification tools" \
            --interfaces="url=http://corporate-email.esmeralda.internal/mcp,protocolBinding=jsonrpc" \
            --mcp-server-spec-type=tool-spec \
            --mcp-server-spec-content=tools.json
        done

substitutions:
  _REGION: 'us-central1'
  _CICD_PROJECT_ID: ''
  _TAG: 'latest'
  _ENV: 'dev'

options:
  logging: CLOUD_LOGGING_ONLY
