# apps/services/income-verification/cloudbuild.yaml
# Cloud Build pipeline for Income Verification Microservice container build & Agent Registry registration across spoke projects

steps:
  # Step 1: Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:latest', '.']

  # Step 2: Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:latest']

  # Step 3: Discover agent spoke projects and register/sync endpoint
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SPOKE_PROJECTS=$$(gcloud projects list --filter="labels.agent_platform=agent-spoke-project" --format="value(projectId)")
        echo "Cloud Build discovered spoke projects for registration: $$SPOKE_PROJECTS"
        for PROJ in $$SPOKE_PROJECTS; do
          echo "Syncing income-verification in project $$PROJ..."
          gcloud alpha agent-registry services create income-verification \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="income-verification" \
            --description="FastMCP service providing applicant employment and income verification tools" \
            --interfaces="url=http://income-verification.esmeralda.internal:8002/mcp,protocolBinding=jsonrpc" \
            --mcp-server-spec-type=no-spec || \
          gcloud alpha agent-registry services update income-verification \
            --project=$$PROJ \
            --location=${_REGION} \
            --display-name="income-verification" \
            --description="FastMCP service providing applicant employment and income verification tools" \
            --interfaces="url=http://income-verification.esmeralda.internal:8002/mcp,protocolBinding=jsonrpc"
        done

substitutions:
  _REGION: 'us-central1'
  _CICD_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
