# apps/services/income-verification/cloudbuild.yaml
# Cloud Build pipeline for Income Verification Microservice container build & Agent Registry registration

steps:
  # Step 1: Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:latest', '.']

  # Step 2: Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:latest']

  # Step 3: Register/Sync Microservice Endpoint in GCP Agent Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud alpha agent-registry services create income-verification \
          --project=${_MCPS_PROJECT_ID} \
          --location=${_REGION} \
          --description="FastMCP service providing applicant employment and income verification tools" \
          --protocol-binding=JSONRPC \
          --url="http://income-verification.esmeralda.internal:8002/mcp" || \
        gcloud alpha agent-registry services update income-verification \
          --project=${_MCPS_PROJECT_ID} \
          --location=${_REGION} \
          --description="FastMCP service providing applicant employment and income verification tools" \
          --protocol-binding=JSONRPC \
          --url="http://income-verification.esmeralda.internal:8002/mcp"

substitutions:
  _REGION: 'us-central1'
  _CICD_PROJECT_ID: ''
  _MCPS_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
