# apps/services/income-verification/cloudbuild.yaml
# Cloud Build pipeline for Income Verification Microservice container build & Agent Registry registration across spoke projects

steps:
  # Step 1: Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:${_TAG}', '.']

  # Step 2: Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_CICD_PROJECT_ID}/esmeralda-containers/income-verification-api:${_TAG}']

  # Step 3: Register / Sync MCP service in Central Governance Agent Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [ -n "${_GOVERNANCE_PROJECT_ID}" ]; then
          GOV_PROJECT="${_GOVERNANCE_PROJECT_ID}"
        else
          GOV_PROJECT=$$(gcloud secrets versions access latest --secret="secret-esmeralda-governance-id-${_ENV}" --project="${_CICD_PROJECT_ID}")
        fi
        echo "Syncing income-verification in Central Governance Project $$GOV_PROJECT..."

        gcloud agent-registry services create income-verification \
          --project="$$GOV_PROJECT" \
          --location="${_REGION}" \
          --display-name="income-verification" \
          --description="FastMCP service providing applicant employment and income verification tools" \
          --interfaces="url=https://income-verification.esmeralda.internal/mcp,protocolBinding=jsonrpc" \
          --mcp-server-spec-type=tool-spec \
          --mcp-server-spec-content=tools.json || \
        gcloud agent-registry services update income-verification \
          --project="$$GOV_PROJECT" \
          --location="${_REGION}" \
          --display-name="income-verification" \
          --description="FastMCP service providing applicant employment and income verification tools" \
          --interfaces="url=https://income-verification.esmeralda.internal/mcp,protocolBinding=jsonrpc" \
          --mcp-server-spec-type=tool-spec \
          --mcp-server-spec-content=tools.json

substitutions:
  _REGION: 'us-central1'
  _CICD_PROJECT_ID: ''
  _GOVERNANCE_PROJECT_ID: ''
  _TAG: 'latest'
  _ENV: 'dev'
  _PROJECT_PREFIX: 'esm-dev'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'
