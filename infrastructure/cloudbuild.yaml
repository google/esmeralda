steps:
  - name: 'hashicorp/terraform:1.5.0'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        export ORG_ID=${_ORG_ID}
        export BILLING_ACCOUNT=${_BILLING_ACCOUNT}
        export PROJECT_ID_BASE=${_PROJECT_ID_BASE}
        export AGENT_NAME=${_AGENT_NAME}
        export REGION=${_REGION}
        
        bash deploy.sh

options:
  logging: CLOUD_LOGGING_ONLY
