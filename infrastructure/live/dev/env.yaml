# infrastructure/live/dev/env.yaml
locals {
  environment         = "dev"
  project_prefix      = "esm-dev"
  region              = "us-central1"

  # 📦 REMOTE STATE CONFIGURATION:
  # Provide an existing GCP Project and GCS Bucket to host Terragrunt/Terraform states.
  # If left empty, the state backend will fall back to "local" (no cloud backend required!).
  state_project       = ""                     # Existing GCP Project ID
  state_bucket        = ""                     # Existing GCS Bucket Name

  # 🔌 BYO INFRA TOGGLES: Greenfield dev starts completely from scratch!
  byo_net_host_project   = false
  byo_gateway_project    = false
  byo_governance_project = false
  byo_networking         = false
  byo_apigee             = false

  existing_net_host_project   = ""
  existing_governance_project = ""
  existing_gateway_project    = ""
  existing_vpc_id             = ""
  existing_subnet_id          = ""

  # 🐳 IMAGES (shared layer 0 CI/CD): dev pulls the mutable dev repository.
  # Every `make build-*` pushes :dev-latest and :dev-<gitsha>; deploys pin the resolved digest.
  image_repository    = "dev"
  container_tag       = "dev-latest"

  # 📇 SERVICE CATALOG (layer 5): every MCP service and agent, served as <name>.<domain> by the entry point.
  #   kind:    mcp (MCP server on Cloud Run) | a2a (A2A agent on Agent Runtime) | adk (ADK agent on Agent Runtime)
  #   unit:    layer-5 unit that deploys it (services/<name> or agents/<name>)
  #   token:   what callers send when the host is served by direct: id (Google ID token, audience
  #            https://<name>.<domain>, checked by Cloud Run IAM) | access (OAuth2 access token, Agent Runtime)
  #   probe:   how `make test-gateway` checks it: mcp (MCP initialize) | a2a (agent card) | query (a real
  #            agent query) | none (TLS + routing only)
  #   timeout: optional, agents: route timeout in seconds (default 600; the aiplatform backend's own is 30 s)
  #   callers: optional: agents (and test-vm) allowed to invoke it. Their service accounts become run.invoker
  #            (mcp) or aiplatform.user on the agent's project (a2a), with the identity agents call out as.
  # Drives the entry point routes, the direct backends, the Envoy adapter routes, the invokers and
  # `make test-gateway`. Adding an entry also takes its unit + one dependency block in gateways/direct
  # (and gateways/envoy when used).
  catalog = {
    legacy-dms                 = { kind = "mcp", unit = "services/legacy-dms", token = "id", probe = "mcp", callers = ["ai-coe-mortgage-specialist", "cx-mortgage-orchestrator", "test-vm"] }
    income-verification        = { kind = "mcp", unit = "services/income-verification", token = "id", probe = "mcp", callers = ["ai-coe-mortgage-specialist", "cx-mortgage-orchestrator", "test-vm"] }
    corporate-email            = { kind = "mcp", unit = "services/corporate-email", token = "id", probe = "mcp", callers = ["ai-coe-mortgage-specialist", "cx-mortgage-orchestrator", "test-vm"] }
    ai-coe-mortgage-specialist = { kind = "a2a", unit = "agents/ai-coe-mortgage-specialist", token = "access", probe = "a2a", callers = ["cx-mortgage-orchestrator", "test-vm"] }
    cx-mortgage-orchestrator   = { kind = "adk", unit = "agents/cx-mortgage-orchestrator", token = "access", probe = "query", timeout = 600 }
  }

  # 🚪 INGRESS (layer 5): one entry point (*.<domain>) serves every catalog host through a backend:
  #   default:    backend of every host not listed in host_rules: "direct" (built-in, no proxy: the load
  #               balancer reaches Cloud Run and Agent Runtime itself) or an enabled adapter
  #   enabled:    bring-your-own adapters deployed under layer-5-workloads/gateways/ (e.g. "envoy"); each
  #               outputs backend_service_id. Not "direct": it is built in
  #   host_rules: optional per-host overrides, host label => "direct" or an enabled adapter
  gateways = {
    default    = "direct"
    enabled    = []
    host_rules = {} # e.g. "legacy-dms" = "envoy"  -> legacy-dms.<domain>
  }

  # 🏛️ GOVERNANCE & CAPABILITIES (layer 4 + optional layer 5 Apigee capability modules):
  #   Agent Gateway is Esmeralda's governance plane for agent traffic. Apigee can optionally
  #   add API-management capabilities, such as partner access, API products and token quotas,
  #   through independent modules selected per capability below.
  governance = {
    apigee = {
      enabled          = false
      byo              = false
      environment_type = "BASE"
    }
    capabilities = {
      egress_allowlist = "agent_gateway" # Agent Registry + IAP egress
      content_safety   = "agent_gateway" # Model Armor on Agent Gateway
      partner_access   = "none"          # "none" | "apigee" | "agent_gateway"
      token_quota      = "none"          # "none" | "apigee" | "agent_gateway"
      usage_metering   = "agent_gateway" # "agent_gateway" (OTel + BQ FinOps) | "apigee"
      cross_cloud      = "agent_gateway" # "agent_gateway" (outbound registry) | "apigee" (inbound/partner)
    }
  }

  database_product    = "cloud-sql"

  billing_account     = get_env("ESMERALDA_BILLING_ACCOUNT") # Corporate billing account ID
  org_id              = get_env("ESMERALDA_ORG_ID", "")         # Google Cloud Organization ID (optional, e.g. "1234567890")
  folder_id           = ""                     # Google Cloud Folder ID (optional, e.g. "9876543210")

  # 📊 OBSERVABILITY & MONITORING CONFIGURATION:
  monitoring_config = {
    notification_channels = [
      "projects/prj-esmeralda-governance/notificationChannels/slack-secops",
      "projects/prj-esmeralda-governance/notificationChannels/pagerduty-p0"
    ]
    # Alert Threshold Overrides
    token_anomaly_threshold_5m = 500000      # 500k tokens in 5 mins
    p95_latency_threshold_ms   = 10000       # 10s P95
    error_rate_threshold_pct   = 2.0         # 2% HTTP 5xx

    # Feature Toggles (Enable/Disable Monitoring Capabilities)
    enable_tco_volume_alerts       = true
    enable_reasoning_engine_alerts = true
  }
}

