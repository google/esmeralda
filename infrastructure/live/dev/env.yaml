# infrastructure/live/dev/env.yaml
locals {
  environment         = "dev"
  project_prefix      = "esmeralda"
  region              = "us-central1"

  # 📦 REMOTE STATE CONFIGURATION:
  # Provide an existing GCP Project and GCS Bucket to host Terragrunt/Terraform states.
  # If left empty, the state backend will fall back to "local" (no cloud backend required!).
  state_project       = ""                     # Existing GCP Project ID
  state_bucket        = ""                     # Existing GCS Bucket Name

  # 🔌 BYO INFRA TOGGLES: Greenfield dev starts completely from scratch!
  byo_net_host_project = false
  byo_gateway_project  = false
  byo_governance_project = false
  byo_networking       = false
  byo_apigee           = false

  existing_net_host_project   = ""
  existing_governance_project = ""
  existing_gateway_project    = ""
  existing_vpc_id             = ""
  existing_subnet_id          = ""

  gateway_product     = "kong" # Use lightweight Kong for development
  database_product    = "cloud-sql"

  billing_account     = "015DBB-3B8B10-665EB3" # Corporate billing account ID
  org_id              = "828556469249"         # Google Cloud Organization ID (optional, e.g. "1234567890")
  folder_id           = ""                     # Google Cloud Folder ID (optional, e.g. "9876543210")

  # 📊 OBSERVABILITY & MONITORING CONFIGURATION:
  monitoring_config = {
    notification_channels = [
      "projects/prj-esmeralda-governance/notificationChannels/slack-secops",
      "projects/prj-esmeralda-governance/notificationChannels/pagerduty-p0"
    ]
    # Alert Threshold Overrides
    token_anomaly_threshold_5m = 500000      # 500k tokens in 5 mins
    p95_latency_threshold_ms   = 10000       # 10s P95
    error_rate_threshold_pct   = 2.0         # 2% HTTP 5xx

    # Feature Toggles (Enable/Disable Monitoring Capabilities)
    enable_token_circuit_breaker   = true
    enable_tco_volume_alerts       = true
    enable_reasoning_engine_alerts = true
  }
}

