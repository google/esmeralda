# infrastructure/live/prd/env.yaml
locals {
  environment         = "prd"
  project_prefix      = "esm-prd"
  region              = "us-central1"

  # 📦 REMOTE STATE CONFIGURATION:
  state_project       = ""
  state_bucket        = ""

  # 🔌 BYO INFRA TOGGLES: Greenfield PRD creates isolated projects, images come from the shared layer-0 CI/CD project
  byo_net_host_project   = false
  byo_gateway_project    = false
  byo_governance_project = false
  byo_networking         = false
  byo_apigee             = false

  existing_net_host_project   = ""
  existing_governance_project = ""
  existing_gateway_project    = ""
  existing_vpc_id             = ""
  existing_subnet_id          = ""

  # 🚪 INGRESS GATEWAYS (layer 5): one entry point (*.esmeralda.internal), one or more gateways.
  #   enabled:    gateway units deployed under layer-5-workloads/gateways/ (each outputs backend_service_id)
  #   default:    gateway that receives every host not listed in host_rules (must be in enabled)
  #   host_rules: optional per-host overrides, host label => gateway (must be in enabled)
  gateways = {
    enabled    = ["kong"]
    default    = "kong"
    host_rules = {} # e.g. "legacy-dms" = "envoy"  -> legacy-dms.<domain>
  }

  # 🏛️ GOVERNANCE & CAPABILITIES (layer 4 + optional layer 5 Apigee capability modules):
  #   Agent Gateway is Esmeralda's governance plane for agent traffic. Apigee can optionally
  #   add API-management capabilities, such as partner access, API products and token quotas,
  #   through independent modules selected per capability below.
  governance = {
    apigee = {
      enabled          = false
      byo              = false
      environment_type = "BASE"
    }
    capabilities = {
      egress_allowlist = "agent_gateway" # Agent Registry + IAP egress
      content_safety   = "agent_gateway" # Model Armor on Agent Gateway
      partner_access   = "none"          # "none" | "apigee" | "agent_gateway"
      token_quota      = "none"          # "none" | "apigee" | "agent_gateway"
      usage_metering   = "agent_gateway" # "agent_gateway" (OTel + BQ FinOps) | "apigee"
      cross_cloud      = "agent_gateway" # "agent_gateway" (outbound registry) | "apigee" (inbound/partner)
    }
  }

  database_product    = "cloud-sql"

  billing_account     = get_env("ESMERALDA_BILLING_ACCOUNT")
  org_id              = get_env("ESMERALDA_ORG_ID", "")
  folder_id           = ""

  # 🐳 IMAGES (shared layer 0 CI/CD): prd only pulls promoted, immutable releases.
  # release/prd.yaml (written by `make promote VERSION=vX.Y.Z SOURCE=dev-<sha>`, merged by PR)
  # pins every image by digest. container_tag is only the fallback while that manifest does not
  # exist yet (e.g. a fresh fork that has never promoted).
  image_repository    = "release"
  container_tag       = "v1.0.0"
  release_manifest    = try(yamldecode(file("${get_repo_root()}/release/prd.yaml")), null)
  image_digests       = try(local.release_manifest.images, {}) # image name => sha256:...

  # 📊 OBSERVABILITY & MONITORING CONFIGURATION:
  monitoring_config = {
    notification_channels = []
    token_anomaly_threshold_5m = 2000000     # 2M tokens in 5 mins
    p95_latency_threshold_ms   = 5000        # 5s P95
    error_rate_threshold_pct   = 0.5         # 0.5% HTTP 5xx
    enable_tco_volume_alerts       = true
    enable_reasoning_engine_alerts = true
  }
}

