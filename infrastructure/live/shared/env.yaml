# infrastructure/live/shared/env.yaml
# Environment-independent layer(s) shared by dev and prd (layer 0: CI/CD).
# Never targeted by env teardown (make destroy-all only touches live/<env>).
locals {
  environment    = "shared"
  project_prefix = "esm"
  region         = "us-central1"

  # 📦 REMOTE STATE CONFIGURATION (empty = local state under live/.local_states/shared)
  state_project = ""
  state_bucket  = ""

  billing_account = get_env("ESMERALDA_BILLING_ACCOUNT")
  org_id          = get_env("ESMERALDA_ORG_ID", "")
  folder_id       = ""
}
