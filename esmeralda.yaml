version: "2.0"
project:
  name: esmeralda
  region: us-central1

infrastructure:
  path: ./infrastructure
  type: terraform

components:
  - name: a2a-agent
    path: ./agents/remotes/a2a-agent
    type: reasoning-engine
    dependencies: []

  - name: base-adk-agent
    path: ./agents/root_agents/base-adk-agent
    type: reasoning-engine
    dependencies:
      - a2a-agent
    environment:
      A2A_AGENT_URL: "${a2a-agent.endpoint_url}"

  - name: network-test-agent
    path: ./agents/root_agents/network-test-agent
    type: reasoning-engine
    dependencies: []
