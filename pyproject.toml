[project]
name = "esmeralda-monorepo"
version = "2.0.0"
description = "Esmeralda: A Cloud-Native Serverless AI Agent Orchestration Monorepo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cloudpickle>=3.0.0",
    "pyyaml>=6.0.0",
    "locust>=2.32.0",
]

# Documentation site (docs/mkdocs.yml). Locked in uv.lock, never installed in images.
[dependency-groups]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
]

[tool.uv.workspace]
members = [
  "packages/esmeralda",
  "apps/agents/cx-mortgage-orchestrator",
  "apps/agents/ai-coe-mortgage-specialist",
  "apps/services/corporate-email",
  "apps/services/income-verification",
  "apps/services/legacy-dms",
]

# Lint settings for every workspace member (`uv run ruff check .`).
[tool.ruff]
line-length = 120
target-version = "py312"
# First-party import roots, for import sorting.
src = ["packages/*/src", "apps/agents/*", "apps/services/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
