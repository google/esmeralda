[project]
name = "esmeralda"
version = "0.1.0"
description = "Operational runtime for Esmeralda agents on Agent Runtime: lifecycle, ADK plugin, telemetry, gateway trust"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.4.0",
    "google-auth",
    "certifi",
    "opentelemetry-api>=1.36.0,<1.46.0",
    "opentelemetry-sdk>=1.36.0,<1.46.0",
    "pyyaml",
    "httpx",
    "a2a-sdk>=0.3.26,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
esmeralda = "esmeralda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
