site_name: Esmeralda
site_description: Reference blueprint for running AI agents and MCP servers in production on Google Cloud
site_url: https://google.github.io/esmeralda/
docs_dir: src
site_dir: ../site
edit_uri: edit/main/docs/src/

repo_url: https://github.com/google/esmeralda
repo_name: google/esmeralda

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/diamond-stone
    repo: octicons/mark-github-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.path
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  # Renders GitHub-flavoured Markdown (alerts, links to repo files) the same way on the site.
  - hooks/github_compat.py
  # Generates reference/make-targets.md from the Makefile's "## help" comments.
  - hooks/make_reference.py

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

nav:
  - "Prologue & Book Index": index.md
  - "Part I — Agents, Tools & Gateways":
    - "Part I Overview": 2-workloads-and-catalog/index.md
    - "Ch 1: Two Teams, Two Agents (ADK & A2A)": 2-workloads-and-catalog/03-ai-agents-and-database.md
    - "Ch 2: MCP Tool Servers": 2-workloads-and-catalog/02-mcp-tool-servers.md
    - "Ch 3: Private Front Door & Gateways": 2-workloads-and-catalog/01-ingress-gateways.md
    - "Ch 3B: Apigee X Partner Gateway": 2-workloads-and-catalog/04-apigee-partner-gateway.md
  - "Part II — Governance & Trust Boundary":
    - "Part II Overview": 3-agentops-and-lifecycle/index.md
    - "Ch 4: Central Agent Gateway": 3-agentops-and-lifecycle/01-central-agent-gateway.md
    - "Ch 5: Capability & Semantic Governance": 3-agentops-and-lifecycle/04-capability-based-governance.md
    - "Ch 6: Monitoring, Dashboards & FinOps": 3-agentops-and-lifecycle/03-centralized-monitoring-and-dashboards.md
    - "Ch 7: Operating with Agents & CLI": 3-agentops-and-lifecycle/04-operating-with-agents.md
  - "Part III — Platform Foundations":
    - "Part III Overview": 1-platform-foundations/index.md
    - "Ch 8: Projects & FinOps (Layer 1)": 1-platform-foundations/01-projects-and-finops.md
    - "Ch 9: Private Networking (Layer 2)": 1-platform-foundations/02-private-networking.md
    - "Ch 10: Security, SPIFFE & PKI (Layer 3)": 1-platform-foundations/03-security-iam-and-telemetry.md
  - "Part IV — Esmeralda Library & CLI":
    - "Part IV Overview": 4-esmeralda-library/index.md
    - "Ch 11: Developer Usage Guide": 4-esmeralda-library/guide.md
    - "Ch 12: Package & CLI Reference": 4-esmeralda-library/reference.md
  - "Reference & Contributing":
    - "Make Targets": reference/make-targets.md
    - "Contributing Guide": contributing.md
    - "Code of Conduct": code-of-conduct.md
