site_name: Esmeralda
site_description: Reference blueprint for running AI agents and MCP servers in production on Google Cloud
site_url: https://google.github.io/esmeralda/
docs_dir: src
site_dir: ../site
edit_uri: edit/main/docs/src/

repo_url: https://github.com/google/esmeralda
repo_name: google/esmeralda

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/diamond-stone
    repo: octicons/mark-github-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.instant
    - navigation.path
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  # Renders GitHub-flavoured Markdown (alerts, links to repo files) the same way on the site.
  - hooks/github_compat.py
  # Generates reference/make-targets.md from the Makefile's "## help" comments.
  - hooks/make_reference.py

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

nav:
  - "Overview": index.md
  - "1. Workloads, Catalog & Gateways":
    - "1.0 Overview": 2-workloads-and-catalog/index.md
    - "1.1 Two Teams, Two Agents (ADK & A2A)": 2-workloads-and-catalog/03-ai-agents-and-database.md
    - "1.2 MCP Tool Servers": 2-workloads-and-catalog/02-mcp-tool-servers.md
    - "1.3 Private Front Door & Gateways": 2-workloads-and-catalog/01-ingress-gateways.md
    - "1.4 Apigee X Partner Gateway & Monetization": 2-workloads-and-catalog/04-apigee-partner-gateway.md
  - "2. Governance, Identity & AgentOps":
    - "2.0 Overview & Release Lifecycle": 3-agentops-and-lifecycle/index.md
    - "2.1 Central Agent Gateway & Private PKI": 3-agentops-and-lifecycle/01-central-agent-gateway.md
    - "2.2 Capability & Semantic Governance": 3-agentops-and-lifecycle/04-capability-based-governance.md
    - "2.3 FinOps, Telemetry & Chargeback": 3-agentops-and-lifecycle/03-centralized-monitoring-and-dashboards.md
    - "2.4 Day-2 Operations (CLI & MCP)": 3-agentops-and-lifecycle/04-operating-with-agents.md
  - "3. Platform Foundations (Layers 1–3)":
    - "3.0 Overview": 1-platform-foundations/index.md
    - "3.1 Projects & FinOps Isolation (Layer 1)": 1-platform-foundations/01-projects-and-finops.md
    - "3.2 Private Networking, PSC & DNS (Layer 2)": 1-platform-foundations/02-private-networking.md
    - "3.3 Security, SPIFFE Identity & PKI (Layer 3)": 1-platform-foundations/03-security-iam-and-telemetry.md
  - "4. Esmeralda Library & CLI":
    - "4.0 Overview": 4-esmeralda-library/index.md
    - "4.1 Developer Usage Guide": 4-esmeralda-library/guide.md
    - "4.2 Package & CLI Reference": 4-esmeralda-library/reference.md
  - "5. Reference & Contributing":
    - "5.1 Make Targets": reference/make-targets.md
    - "5.2 Contributing Guide": contributing.md
    - "5.3 Code of Conduct": code-of-conduct.md
