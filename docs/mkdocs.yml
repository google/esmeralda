site_name: Esmeralda
site_description: Reference blueprint for running AI agents and MCP servers in production on Google Cloud
site_url: https://google.github.io/esmeralda/
docs_dir: src
site_dir: ../site
edit_uri: edit/main/docs/src/

repo_url: https://github.com/google/esmeralda
repo_name: google/esmeralda

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/diamond-stone
    repo: octicons/mark-github-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  # Renders GitHub-flavoured Markdown (alerts, links to repo files) the same way on the site.
  - hooks/github_compat.py
  # Generates reference/make-targets.md from the Makefile's "## help" comments.
  - hooks/make_reference.py

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Platform Foundations:
    - 1-platform-foundations/index.md
    - "Layer 1: Projects & FinOps": 1-platform-foundations/01-projects-and-finops.md
    - "Layer 2: Private Networking": 1-platform-foundations/02-private-networking.md
    - "Layer 3: Security, IAM & PKI": 1-platform-foundations/03-security-iam-and-telemetry.md
  - Workloads & Catalog:
    - 2-workloads-and-catalog/index.md
    - Ingress Gateways: 2-workloads-and-catalog/01-ingress-gateways.md
    - MCP Tool Servers: 2-workloads-and-catalog/02-mcp-tool-servers.md
    - AI Agents & Database: 2-workloads-and-catalog/03-ai-agents-and-database.md
  - AgentOps & Governance:
    - 3-agentops-and-lifecycle/index.md
    - Central Agent Gateway: 3-agentops-and-lifecycle/01-central-agent-gateway.md
    - Monitoring, Dashboards & FinOps: 3-agentops-and-lifecycle/03-centralized-monitoring-and-dashboards.md
  - Esmeralda Library:
    - 4-esmeralda-library/index.md
    - Usage Guide: 4-esmeralda-library/guide.md
    - Package Reference: 4-esmeralda-library/reference.md
  - Reference:
    - Make Targets: reference/make-targets.md
  - Contributing:
    - Contributing Guide: contributing.md
    - Code of Conduct: code-of-conduct.md
