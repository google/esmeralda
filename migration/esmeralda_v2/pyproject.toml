[project]
name = "esmeralda-monorepo"
version = "2.0.0"
description = "Esmeralda: A Cloud-Native Serverless AI Agent Orchestration Monorepo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cloudpickle>=3.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
  "app/agents/base-adk-agent",
  "app/agents/a2a-agent",
  "app/mcp-servers/corporate-email",
  "app/mcp-servers/income-verification",
  "app/mcp-servers/legacy-dms",
]
